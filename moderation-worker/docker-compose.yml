services:
  moderation-worker:
    build: .
    container_name: spotted-moderation-worker
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      BATCH: ${BATCH:-5}
    # No ports exposed — the worker only makes OUTBOUND calls to Supabase.
